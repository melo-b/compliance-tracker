[project]
name = "compliance-tracker"
version = "0.1.0"
description = "Compliance Tracker API: product safety lifecycles, standards mapping and certification expiry for the TIC industry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "sqlalchemy>=2.0.51,<2.1",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "celery>=5.6.3",
    "redis>=8.0.1",
    "pydantic-settings>=2.15.0",
    "alembic>=1.20.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.15.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) in argument defaults is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The repo has an ./alembic folder; the import below is the installed package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Libraries that ship no type information
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# CI fails if total coverage (lines and branches) drops below this
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == .__main__.:',
    '^\s*\.\.\.$',  # the "..." bodies of Protocol methods
]
