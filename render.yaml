services:
  - type: web
    name: compliance-api
    env: docker
    plan: free
    # Render's Docker Command replaces the image's ENTRYPOINT as well as CMD, and the free plan
    # has no Pre-Deploy Command. So this command runs the entrypoint script itself: it applies
    # database migrations, then starts uvicorn on Render's $PORT.
    dockerCommand: sh /app/docker/entrypoint.sh uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CELERY_BROKER_URL
        sync: false

  - type: worker
    name: compliance-worker
    env: docker
    plan: free
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info
    envVars:
      - key: SKIP_MIGRATIONS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
