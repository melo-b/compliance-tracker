[project]
name = "compliance-tracker"
version = "0.1.0"
description = "Compliance Tracker API: product safety lifecycles, standards mapping and certification expiry for the TIC industry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "sqlalchemy>=2.0.51,<2.1",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.2",
    "celery>=5.6.3",
    "redis>=8.0.1",
    # Auth libraries are swapped for pwdlib + PyJWT in Phase 2.
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    # passlib 1.7.4 is incompatible with newer bcrypt releases.
    "bcrypt==3.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) in argument defaults is the framework's idiom.
ignore = ["B008"]
