
# SECRET_KEY must be set in your shell or in a .env file next to this file (see .env.example).
x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:password123@db:5432/compliance_db
  CELERY_BROKER_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: compliance_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compliance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      # This points the API to the internal Docker network. Migrations run on start.
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    restart: on-failure
    # This overrides the default Dockerfile CMD to start the worker instead of the API
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      <<: *app-environment
      # The API container owns migrations
      SKIP_MIGRATIONS: "1"
    depends_on:
      - api
      - db
      - redis

volumes:
  postgres_data:
